[package]
name = "overdrive"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
sysinfo = "0.31"          # enumerazione processi, CPU, RAM cross-platform
winreg = "0.52"           # lettura/scrittura registro di Windows
tauri-plugin-shell = "2"  # per aprire i .reg di backup da Explorer, se serve
dirs = "5"                # percorsi standard (AppData ecc.)
windows = { version = "0.58", features = [
    "Win32_System_Threading",       # SetPriorityClass, apertura processi
    "Win32_System_Power",           # power plan / effective power mode
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
